<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Podvisor — AI insights from any video or audio</title>
    <meta name="description" content="Turn any YouTube video or audio file into personalized, expert-level insights in minutes. Built for people who learn from podcasts and long-form content." />
    <meta name="author" content="Podvisor" />
    <meta name="keywords" content="youtube insights, AI video analysis, audio analysis, personalized learning, content advisor, podcast notes" />
    <link rel="canonical" href="https://podvisor.app/" />

    <!-- Fonts: SF-style stack with Inter fallback + Space Grotesk for display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Open Graph -->
    <meta property="og:title" content="Podvisor — AI insights from any video or audio" />
    <meta property="og:description" content="Turn any YouTube video or audio file into personalized, expert-level insights in minutes." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://podvisor.app/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Podvisor — AI insights from any video or audio" />
    <meta name="twitter:description" content="Turn any YouTube video or audio file into personalized, expert-level insights in minutes." />

    <!-- iOS / PWA -->
    <meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Podvisor" />
    <meta name="format-detection" content="telephone=no" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
